[package]
name = "assistente-3d"
version = "0.1.0"
description = "Validação gráfica M0-A da assistente 3D"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
perf1c-probe = ["tauri/dynamic-acl"]
perf1d-probe = ["perf1c-probe"]
lr9b-probe = ["perf1c-probe"]
lr9c-probe = ["perf1c-probe"]

[lib]
name = "assistente_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.3.7"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time", "macros"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "stream", "rustls-tls"] }
httpdate = "=1.0.3"
tauri-plugin-stronghold = { version = "2.3.2", default-features = false }
getrandom = "0.3"
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
portable-pty = { version = "=0.9.0", default-features = false }
# Already resolved by Tauri/portable-pty; nonblocking descriptors and managed signals.
libc = "=0.2.189"
# Same binding already used by Wry; official renderer teardown (WebKit >=2.34).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
dbus-secret-service = { version = "=4.0.1", default-features = false }
iota_stronghold = { version = "2.1.0", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }

# Stronghold usa scrypt ao abrir/salvar snapshots; em debug sem otimizacao fica muito lento.
[profile.dev.package.scrypt]
opt-level = 3
