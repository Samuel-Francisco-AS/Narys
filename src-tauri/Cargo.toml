[package]
name = "assistente-3d"
version = "0.1.0"
description = "Validação gráfica M0-A da assistente 3D"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "assistente_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-stronghold = { version = "2.3.2", default-features = false }
getrandom = "0.3"
iota_stronghold = { version = "2.1.0", default-features = false }

# Stronghold usa scrypt ao abrir/salvar snapshots; em debug sem otimizacao fica muito lento.
[profile.dev.package.scrypt]
opt-level = 3
